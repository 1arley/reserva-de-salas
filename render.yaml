services:
  - type: web
    name: reserva-salas-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_PREFIX
        value: api
      - key: SWAGGER_PATH
        value: api/docs
      - key: DATABASE_URL
        fromDatabase:
          name: reserva-salas-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: CORS_CREDENTIALS
        value: "false"

databases:
  - name: reserva-salas-db
    databaseName: reserva_salas
    user: reserva_user
    plan: free
    region: oregon
